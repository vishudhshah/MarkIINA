<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkIINA Bookmarks</title>
<style>
:root { color-scheme: light dark; --text:#16161a; --muted:#303039; --line:rgba(0,0,0,.28); --field:rgba(255,255,255,.48); --surface:rgba(255,255,255,.24); --shadow:0 1px 2px rgba(255,255,255,.9); --accent:#005bb5; --button:#005bb5; --on-button:#ffffff; }
@media(prefers-color-scheme:dark) { :root { --text:#ffffff; --muted:#f0f0f5; --line:rgba(255,255,255,.35); --field:rgba(20,20,26,.38); --surface:rgba(15,15,20,.20); --shadow:0 1px 3px rgba(0,0,0,.95), 0 0 1px rgba(0,0,0,.8); --accent:#a1d2ff; --button:#a1d2ff; --on-button:#10243a; } }
* { box-sizing:border-box; }
html { min-height:100%; background:transparent; color:var(--text); }
body { min-height:100vh; background:transparent; color:var(--text); margin:0; padding:18px 14px; font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif; text-shadow:var(--shadow); -webkit-font-smoothing:antialiased; }
h1 { font-size:19px; margin:0 0 4px; letter-spacing:-.4px; }
#video { color:var(--muted); overflow-wrap:anywhere; margin:0 0 20px; }
form { padding:2px 10px 10px; margin:0 -4px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
label { display:block; margin:10px 0 4px; font-weight:600; }
input { width:100%; padding:8px; border:1px solid var(--line); border-radius:5px; background:var(--field); color:inherit; font:inherit; text-shadow:var(--shadow); }
button { text-shadow:var(--shadow); font:inherit; color:inherit; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:var(--field); padding:7px 10px; }
input::placeholder { color:var(--muted); opacity:1; }
button:disabled { color:var(--muted); background:var(--field); cursor:default; }
input:disabled { opacity:1; color:var(--muted); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
small { display:block; color:var(--muted); margin-top:6px; font-size:12px; font-weight:500; }
#add { text-shadow:none; width:100%; margin-top:12px; background:var(--button); color:var(--on-button); border-color:transparent; font-weight:600; }
#add:disabled { background:var(--field); color:var(--muted); border-color:var(--line); }
#message { min-height:20px; margin:8px 0; color:var(--muted); }
h2 { font-size:13px; margin:15px 0 7px; }
ul { list-style:none; padding:0; margin:0; }
li { background:var(--surface); border-radius:6px; margin-bottom:5px; padding-inline:6px; display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); padding:6px 0; }
.jump:hover { background:var(--field); }
.jump { border:0; background:none; text-align:left; flex:1; min-width:0; overflow-wrap:anywhere; padding:8px 2px; }
.delete { font-size:12px; padding:5px 7px; }
#empty { color:var(--muted); font-weight:500; }
#video, #message { font-weight:500; }
</style>
</head>
<body>
<h1>Bookmarks</h1>
<p id="video">Open a video to add bookmarks.</p>
<form id="form">
<label for="name">Name <span style="font-weight:400">(optional)</span></label>
<input id="name" autocomplete="off" placeholder="e.g. Opening scene">
<label for="time">Timestamp <span style="font-weight:400">(optional)</span></label>
<input id="time" autocomplete="off" placeholder="Current position">
<small>Blank uses the current position. Or enter seconds, MM:SS, or HH:MM:SS.</small>
<button id="add" type="submit" disabled>Add bookmark</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<h2 id="count">Saved bookmarks</h2>
<p id="empty">No bookmarks yet.</p>
<ul id="bookmarks" aria-label="Saved bookmarks"></ul>
<script src="sidebar.js"></script>
</body>
</html>
